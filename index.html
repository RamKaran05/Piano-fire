<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Fire: Hand Tracking</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; }
        canvas { display: block; }
        
        /* UI Elements */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; }
        #score-board { font-size: 28px; color: #00f2ff; text-shadow: 0 0 10px #00f2ff; }
        #combo-board { text-align: right; }
        #combo-count { font-size: 48px; color: #ff0055; display: block; }

        /* Calibration Overlay */
        #overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; 
        }
        .guide-box { border: 2px dashed #555; width: 200px; height: 250px; position: absolute; border-radius: 20px; }
        #guide-left { left: 15%; top: 40%; }
        #guide-right { right: 15%; top: 40%; }
        #status-text { margin-top: 20px; font-size: 20px; color: #aaa; }
        .btn { padding: 15px 40px; font-size: 20px; background: #00f2ff; border: none; cursor: pointer; border-radius: 50px; margin-top: 300px; transition: 0.3s; }
        .btn:disabled { background: #333; cursor: not-allowed; }

        /* Small Preview */
        #webcam-view { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; border: 2px solid #333; transform: scaleX(-1); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>PIANO FIRE</h1>
        <div id="guide-left" class="guide-box"><p style="text-align:center; color:#00f2ff">LEFT HAND</p></div>
        <div id="guide-right" class="guide-box"><p style="text-align:center; color:#ff0055">RIGHT HAND</p></div>
        <p id="status-text">Detecting hands...</p>
        <button id="start-btn" class="btn" disabled>START GAME</button>
    </div>

    <div id="ui-layer">
        <div id="score-board">SCORE: <span id="score">0</span><br><small id="rating" style="color: white;"></small></div>
        <div id="combo-board"><span id="combo-count">0</span>COMBO</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <canvas id="webcam-view"></canvas>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="game.js"></script>
</body>
</html>
